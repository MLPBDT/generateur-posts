<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PostIA — Générateur de posts réseaux sociaux</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f0f;--card:#1a1a1a;--border:#2a2a2a;--accent:#c8f135;--text:#f0f0f0;--muted:#888;--radius:14px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
button,.toggle-btn,.plat-btn,.btn-sm,.btn-gen{touch-action:manipulation}
input,select,textarea{font-size:16px !important} /* empêche le zoom auto iOS au focus */

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:10px}
.credits{flex-shrink:0;white-space:nowrap}
.logo{font-size:18px;font-weight:600;color:var(--accent)}
.credits{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:99px}

/* Toggle photo/sans photo */
.toggle-wrap{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px;gap:2px}
@media(max-width:380px){
  .toggle-btn{font-size:11px;padding:13px 4px;letter-spacing:-0.2px}
}
.toggle-btn{flex:1;padding:13px 8px;text-align:center;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--muted);min-height:44px;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
.toggle-btn:active{transform:scale(0.96)}
.toggle-btn.active{background:var(--accent);color:#000}

/* Upload zone */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s;position:relative;margin-bottom:20px;display:none}
.upload-zone.visible{display:block}
.upload-zone:hover{border-color:var(--accent)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--muted)}
.upload-text span{color:var(--accent)}
.photos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.photo-thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;border:1px solid var(--border)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.85);border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}

/* Form */
.form-group{margin-bottom:16px}
.form-label{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px;display:block}
.form-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:14px 16px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:#444}
select.form-input{cursor:pointer}
select.form-input option{background:var(--card)}

/* Plateformes */
.platforms{display:flex;gap:8px;flex-wrap:wrap}
.plat-btn{background:var(--card);border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:13px;font-weight:500;padding:10px 18px;cursor:pointer;transition:all .15s;min-height:40px;display:flex;align-items:center;-webkit-user-select:none;user-select:none}
.plat-btn:active{transform:scale(0.95)}
.plat-btn.active{background:var(--accent);border-color:var(--accent);color:#000}

/* Grid 2 cols */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}

/* Bouton générer */
.btn-gen{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:16px;font-weight:700;padding:18px;cursor:pointer;transition:all .15s;margin-top:8px;min-height:54px;-webkit-user-select:none;user-select:none}
.btn-gen:active{transform:scale(0.98);opacity:.9}
.btn-gen:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Loader */
.loader{display:none;align-items:center;justify-content:center;gap:10px;padding:20px;color:var(--muted);font-size:14px}
.loader.show{display:flex}
.dots span{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;animation:bounce .7s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-7px);opacity:1}}

/* Résultats */
.results{display:none;margin-top:28px}
.results.show{display:block}
.results-title{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}

/* Post card */
.post-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.post-img{width:100%;height:200px;object-fit:cover;display:block}
.post-body{padding:18px}
.post-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.post-platform{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.post-btns{display:flex;gap:8px}
.btn-sm{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;padding:8px 14px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;min-height:36px;-webkit-user-select:none;user-select:none}
.btn-sm:active{transform:scale(0.95);border-color:var(--accent);color:var(--accent)}
.btn-sm.ok{border-color:var(--accent);color:var(--accent)}
.post-text{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
.post-extra{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6;font-style:italic}
.post-extra-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#555;margin-bottom:4px}

/* Error */
.err{background:#1a0808;border:1px solid #3a1010;border-radius:12px;color:#ff6b6b;padding:14px 16px;font-size:13px;display:none;margin-top:12px}
.err.show{display:block}

/* Separator */
.sep{height:1px;background:var(--border);margin:20px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">PostIA ✦</div>
    <div class="credits">200 posts restants</div>
  </div>

  <!-- Toggle avec/sans photo -->
  <div class="toggle-wrap">
    <div class="toggle-btn active" id="btnSans" onclick="setPhoto(false)">✍️ Sans photo</div>
    <div class="toggle-btn" id="btnAvec" onclick="setPhoto(true)">📸 Avec mes photos</div>
    <div class="toggle-btn" id="btnIA" onclick="setPhoto('ia')">🤖 Image IA</div>
  </div>

  <!-- Upload photos -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="photoInput" accept="image/*" multiple onchange="handlePhotos(event)" />
    <div class="upload-icon">📸</div>
    <p class="upload-text">Glisse tes photos ou <span>clique pour choisir</span></p>
    <p class="upload-text" style="font-size:12px;margin-top:4px">Plusieurs photos acceptées</p>
    <div class="photos-grid" id="photosGrid"></div>
  </div>

  <!-- Style IA (si mode IA) -->
  <div class="form-group" id="iaStyleGroup" style="display:none">
    <label class="form-label">Style des images</label>
    <select class="form-input" id="iaStyle">
      <option value="lifestyle photography, warm natural light, authentic">🌿 Lifestyle naturel</option>
      <option value="minimalist flat lay, pastel colors, Instagram aesthetic" selected>✨ Flat lay Instagram</option>
      <option value="professional product photography, clean white background">📦 Produit professionnel</option>
      <option value="food photography, appetizing, restaurant lighting">🍽️ Food photography</option>
      <option value="luxury editorial photography, cinematic lighting">💎 Luxe & élégance</option>
      <option value="fitness photography, energetic, action shot">💪 Fitness & sport</option>
    </select>
  </div>

  <!-- Description libre de l'image IA -->
  <div class="form-group" id="iaDescGroup" style="display:none">
    <label class="form-label">Décris l'image que tu veux <span style="color:#555;font-weight:400;text-transform:none;letter-spacing:0">(optionnel)</span></label>
    <input type="text" class="form-input" id="iaDesc" placeholder="Ex: fond bleu pastel, avec des fleurs, ambiance cosy, vue de dessus...">
  </div>

  <!-- Formulaire -->
  <div class="form-group">
    <label class="form-label">Ton activité</label>
    <input type="text" class="form-input" id="business" placeholder="Ex: restaurant italien à Toulon, coiffeur femme à Lyon..." />
  </div>

  <div class="form-group">
    <label class="form-label">Promo ou message du moment <span style="color:#555;font-weight:400">(optionnel)</span></label>
    <input type="text" class="form-input" id="promo" placeholder="Ex: -20% ce weekend, nouveau menu disponible..." />
  </div>

  <div class="grid2">
    <div class="form-group">
      <label class="form-label">Ton de voix</label>
      <select class="form-input" id="tone">
        <option value="sympathique et chaleureux" selected>😊 Sympathique</option>
        <option value="professionnel">💼 Professionnel</option>
        <option value="humoristique">😄 Humoristique</option>
        <option value="luxe et raffiné">✨ Luxe</option>
        <option value="dynamique et énergique">⚡ Dynamique</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre de posts</label>
      <select class="form-input" id="count">
        <option value="3">3 posts</option>
        <option value="5" selected>5 posts</option>
        <option value="7">7 posts</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Réseaux sociaux</label>
    <div class="platforms">
      <button class="plat-btn active" data-p="Instagram">Instagram</button>
      <button class="plat-btn active" data-p="Facebook">Facebook</button>
      <button class="plat-btn" data-p="LinkedIn">LinkedIn</button>
      <button class="plat-btn" data-p="TikTok">TikTok</button>
      <button class="plat-btn" data-p="Twitter/X">Twitter/X</button>
    </div>
  </div>

  <button class="btn-gen" id="genBtn" onclick="generate()">⚡ Générer mes posts</button>

  <div class="loader" id="loader">
    <div class="dots"><span></span><span></span><span></span></div>
    L'IA rédige tes posts...
  </div>

  <div class="err" id="err"></div>

  <div class="results" id="results">
    <div class="sep"></div>
    <div class="results-title">Tes posts générés</div>
    <div id="postsContainer"></div>
  </div>

</div>
<script>
var mode = 'sans';
var photos = [];

function setPhoto(val) {
  mode = val === true ? 'avec' : val === 'ia' ? 'ia' : 'sans';
  document.getElementById('btnSans').classList.toggle('active', mode==='sans');
  document.getElementById('btnAvec').classList.toggle('active', mode==='avec');
  document.getElementById('btnIA').classList.toggle('active', mode==='ia');
  document.getElementById('uploadZone').classList.toggle('visible', mode==='avec');
  document.getElementById('iaStyleGroup').style.display = mode==='ia' ? 'block' : 'none';
  document.getElementById('iaDescGroup').style.display = mode==='ia' ? 'block' : 'none';
}

document.querySelectorAll('.plat-btn').forEach(function(b){
  b.addEventListener('click',function(){ b.classList.toggle('active'); });
});

function handlePhotos(e) {
  var files = Array.from(e.target.files).slice(0, 10 - photos.length);
  files.forEach(function(f){
    var r = new FileReader();
    r.onload = function(ev){
      photos.push({ dataUrl: ev.target.result, name: f.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ') });
      renderGrid();
    };
    r.readAsDataURL(f);
  });
  e.target.value='';
}

function removePhoto(i){ photos.splice(i,1); renderGrid(); }

function renderGrid(){
  var g = document.getElementById('photosGrid');
  g.innerHTML='';
  photos.forEach(function(p,i){
    var d=document.createElement('div');
    d.className='photo-thumb';
    d.innerHTML='<img src="'+p.dataUrl+'" /><button class="rm" onclick="removePhoto('+i+')">✕</button>';
    g.appendChild(d);
  });
}

function getPlatforms(){
  return Array.from(document.querySelectorAll('.plat-btn.active')).map(function(b){ return b.dataset.p; });
}

function showErr(msg){
  var e=document.getElementById('err');
  e.textContent=msg; e.classList.add('show');
}

async function generate(){
  var business=document.getElementById('business').value.trim();
  var promo=document.getElementById('promo').value.trim();
  var tone=document.getElementById('tone').value;
  var count=document.getElementById('count').value;
  var platforms=getPlatforms();

  document.getElementById('err').classList.remove('show');
  if(!business){ showErr('Décris ton activité pour continuer.'); return; }
  if(!platforms.length){ showErr('Sélectionne au moins un réseau social.'); return; }
  if(mode==='avec' && photos.length===0){ showErr('Ajoute au moins une photo.'); return; }

  document.getElementById('genBtn').disabled=true;
  document.getElementById('loader').classList.add('show');
  document.getElementById('results').classList.remove('show');

  var photoLine = photos.length > 0
    ? '- Photos uploadées : '+photos.map(function(p){ return '"'+p.name+'"'; }).join(', ')+'.\n' : '';
  var promoLine = promo ? '- Promo : '+promo+'\n' : '';
  var iaDescVal = mode==='ia' ? document.getElementById('iaDesc').value.trim() : '';
  var iaDescLine = iaDescVal ? ' L\'image doit absolument inclure : '+iaDescVal+'.' : '';
  var iaLine = mode==='ia' ? '- Pour chaque post ajoute "image_prompt": prompt anglais 15 mots max décrivant une image. Style: '+document.getElementById('iaStyle').value+'.'+iaDescLine+'\n' : '';
  var extraFields = '';
  if(mode==='ia') extraFields+=', "image_prompt": "..."';
  if(photos.length>0) extraFields+=', "photo_index": 0';

  var prompt='Tu es expert marketing digital.\n\nGénère exactement '+count+' posts pour:\n- Business: '+business+'\n- Plateformes: '+platforms.join(', ')+'\n'+promoLine+photoLine+iaLine+'- Ton: '+tone+'\n\nVarie les angles, adapte à chaque plateforme, emojis + appel à l\'action.\n\nJSON uniquement sans backticks:\n{"posts":[{"platform":"nom","content":"texte"'+extraFields+'},…]}';

  try{
    var res=await fetch('/api/generate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){ var e2=await res.json(); throw new Error(e2.error||'Erreur '+res.status); }
    var data=await res.json();
    var text=(data.content||[]).map(function(b){ return b.text||''; }).join('');
    var clean=text.replace(/```json|```/g,'').trim();
    var parsed=JSON.parse(clean);
    renderPosts(parsed.posts||[]);
  }catch(e){
    showErr('Erreur: '+(e.message||'Réessaie.'));
  }finally{
    document.getElementById('genBtn').disabled=false;
    document.getElementById('loader').classList.remove('show');
  }
}

function renderPosts(posts){
  var c=document.getElementById('postsContainer');
  c.innerHTML='';
  if(!posts.length){ showErr('Aucun post généré.'); return; }

  posts.forEach(function(post,i){
    var card=document.createElement('div');
    card.className='post-card';
    card.style.animationDelay=(i*.07)+'s';

    var photoHtml='';
    var dlBtn='';

    if(photos.length>0){
      var idx=(typeof post.photo_index==='number'&&post.photo_index>=0&&post.photo_index<photos.length)?post.photo_index:(i%photos.length);
      photoHtml='<img class="post-img" src="'+photos[idx].dataUrl+'" />';
      dlBtn='<button class="btn-sm" onclick="dlPhoto('+idx+','+i+')">⬇ Photo</button>';
    } else if(mode==='ia'&&post.image_prompt){
      var style=document.getElementById('iaStyle').value;
      var descExtra=document.getElementById('iaDesc').value.trim();
      var fullPrompt=post.image_prompt+', '+style+(descExtra?', '+descExtra:'');
      photoHtml='<div class="post-img" id="aiwrap-'+i+'" style="display:flex;align-items:center;justify-content:center;background:#111;flex-direction:column;gap:8px"><div style="font-size:28px;animation:bounce .7s infinite">🎨</div><div style="font-size:12px;color:#555">Génération...</div></div>';
      dlBtn='<button class="btn-sm" id="aidl-'+i+'" style="display:none" onclick="dlAi('+i+')">⬇ Image</button>';
      setTimeout(function(ci,p){ genAiImg(ci,p); }.bind(null,i,fullPrompt), i*800);
    }

    card.innerHTML=photoHtml+
      '<div class="post-body">'+
        '<div class="post-top">'+
          '<span class="post-platform">'+escH(post.platform)+'</span>'+
          '<div class="post-btns">'+dlBtn+'<button class="btn-sm" onclick="copy(this,\'pt-'+i+'\')">Copier</button></div>'+
        '</div>'+
        '<div class="post-text" id="pt-'+i+'">'+escH(post.content)+'</div>'+
      '</div>';
    c.appendChild(card);
  });

  document.getElementById('results').classList.add('show');
}

async function genAiImg(i,prompt){
  var wrap=document.getElementById('aiwrap-'+i);
  if(!wrap)return;
  try{
    var res=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})});
    var data=await res.json();
    if(!data.image)throw new Error(data.error||'Erreur');
    wrap.outerHTML='<img class="post-img" id="aiimg-'+i+'" src="'+data.image+'" />';
    var dl=document.getElementById('aidl-'+i);
    if(dl){dl.style.display='';dl.dataset.src=data.image;}
  }catch(e){
    if(wrap)wrap.innerHTML='<div style="color:#ff6b6b;font-size:13px;padding:20px;text-align:center">❌ '+(e.message||'Erreur')+'<br><button onclick="genAiImg('+i+',\''+prompt+'\')" style="margin-top:8px;background:transparent;border:1px solid #ff6b6b;color:#ff6b6b;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px">🔄 Réessayer</button></div>';
  }
}

function dlAi(i){
  var btn=document.getElementById('aidl-'+i);
  if(!btn||!btn.dataset.src)return;
  var a=document.createElement('a');
  a.href=btn.dataset.src;a.download='image-ia-'+(i+1)+'.png';a.click();
}

function dlPhoto(photoIdx,postIdx){
  if(!photos[photoIdx])return;
  var a=document.createElement('a');
  a.href=photos[photoIdx].dataUrl;a.download='photo-post-'+(postIdx+1)+'.jpg';a.click();
}

function copy(btn,id){
  var t=document.getElementById(id);
  if(!t)return;
  var text=t.innerText;

  function showSuccess(){
    btn.textContent='✓ Copié!';btn.classList.add('ok');
    if(navigator.vibrate)navigator.vibrate(10);
    setTimeout(function(){btn.textContent='Copier';btn.classList.remove('ok');},2000);
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showSuccess).catch(function(){
      fallbackCopy(text, showSuccess);
    });
  } else {
    fallbackCopy(text, showSuccess);
  }
}

function fallbackCopy(text, onSuccess){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.left='-9999px';
  ta.style.top='0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{
    document.execCommand('copy');
    onSuccess();
  }catch(e){
    alert('Impossible de copier automatiquement. Sélectionne le texte manuellement.');
  }
  document.body.removeChild(ta);
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
